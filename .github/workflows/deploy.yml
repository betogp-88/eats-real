# Dispara un deploy en Vercel en cada push.
# Necesita el secreto VERCEL_DEPLOY_HOOK (Vercel → Settings → Git → Deploy Hooks).
name: Deploy en Vercel
on:
  push:
    branches: ["**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
